<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国地图 · Zhōngguó Dìtú — Provinces & Capitals</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --bg:#f2f1ec;--panel:#ffffff;--ink:#23262b;--muted:#6f6a5e;--line:#e3e0d6;
  --accent:#b3382c;--accent-soft:#f6e8e6;--gold:#a07a18;--shadow:0 1px 3px rgba(30,30,20,.08),0 10px 30px rgba(30,30,20,.10);
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#141517;--panel:#1f2124;--ink:#e8e6df;--muted:#98937f;--line:#33363b;
    --accent:#e06c5e;--accent-soft:#3a2622;--gold:#d4af37;--shadow:0 1px 3px rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg);color:var(--ink);display:flex;flex-direction:column;
}
.hanzi{font-family:"Songti SC","STSong","Noto Serif CJK SC","Noto Serif SC","PingFang SC","Microsoft YaHei",serif}
header{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 20px;
  background:var(--panel);border-bottom:1px solid var(--line);box-shadow:var(--shadow);z-index:1100;
}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;line-height:1.25}
.logo{width:38px;height:38px;border-radius:9px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600}
.subtitle{font-size:12.5px;color:var(--muted);font-weight:500}
.stats-row{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.chip b{color:var(--ink);margin-right:4px}
.chip .swatch{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid rgba(0,0,0,.15)}
#app{flex:1;display:flex;min-height:0;position:relative}
#map{flex:1;background:#dde3e2;z-index:1}
@media(prefers-color-scheme:dark){#map{background:#101315}}
.map-ui{position:absolute;z-index:1000}
#searchBox{
  top:14px;left:60px;width:280px;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;box-shadow:var(--shadow);
}
#searchInput{
  width:100%;border:none;background:none;color:var(--ink);padding:10px 14px;font:inherit;font-size:14px;outline:none;border-radius:12px;
}
#searchInput::placeholder{color:var(--muted)}
#searchResults{
  display:none;max-height:300px;overflow:auto;border-top:1px solid var(--line);
}
.sr-item{padding:8px 14px;cursor:pointer;display:flex;gap:10px;align-items:baseline;font-size:13.5px}
.sr-item:hover{background:var(--accent-soft)}
.sr-item .zh{font-weight:600;font-size:15px;white-space:nowrap}
.sr-item .py{color:var(--gold);font-size:12px;white-space:nowrap}
.sr-item .en{color:var(--muted);margin-left:auto;font-size:12px;text-align:right}
#legend{
  bottom:20px;left:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;
  box-shadow:var(--shadow);padding:10px 14px;font-size:12px;color:var(--muted);
}
#legend .row{display:flex;align-items:center;gap:7px;margin:3px 0}
#legend .sw{width:13px;height:13px;border-radius:4px;border:1px solid rgba(0,0,0,.18)}
#basemapToggle{top:14px;right:14px;display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
#basemapToggle button{border:none;background:none;color:var(--muted);padding:7px 13px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
#basemapToggle button.active{background:var(--accent);color:#fff}
#panel{
  position:absolute;top:64px;right:14px;width:330px;max-height:calc(100% - 84px);overflow:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
  padding:22px;display:none;z-index:1050;
}
#panel.show{display:block}
#panelClose{position:absolute;top:10px;right:12px;border:none;background:none;color:var(--muted);font-size:18px;cursor:pointer;line-height:1;padding:4px}
#pBig{font-size:42px;line-height:1.2;margin-bottom:2px}
#pPy{color:var(--gold);font-size:19px;margin-bottom:1px}
#pEn{color:var(--muted);font-size:14px;margin-bottom:10px}
#pType{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);margin-bottom:16px}
.cap-block{border-top:1px solid var(--line);padding-top:14px;margin-top:4px}
.k{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:3px}
#capHan{font-size:30px;line-height:1.25}
#capPy{color:var(--gold);font-size:16px}
#capEn{color:var(--muted);font-size:13px}
#panelActions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 13px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
#readBtn{width:100%;margin-top:10px;background:var(--bg)}
#readBtn.on{background:var(--gold);border-color:var(--gold);color:#fff}
#reader{display:none;margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
#reader.open{display:block}
.layer-row{display:flex;gap:6px;margin-bottom:12px;position:sticky;top:-13px;background:var(--panel);padding:8px 0;z-index:5;border-bottom:1px solid var(--line);flex-wrap:wrap}
.lchip{
  border:1px solid var(--line);background:none;color:var(--muted);border-radius:99px;
  padding:3px 11px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;
}
.lchip.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.sec-card{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden;background:var(--panel)}
.sec-head{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;background:var(--bg);user-select:none}
.sec-head:hover{background:var(--accent-soft)}
.sec-head .icon{font-size:14px;flex-shrink:0}
.sec-head .t-zh{font-weight:700;font-size:14px;white-space:nowrap}
.sec-head .t-py{color:var(--gold);font-size:11.5px;white-space:nowrap}
.sec-head .t-en{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec-head .chev{margin-left:auto;color:var(--muted);font-size:12px;flex-shrink:0;transition:transform .2s}
.sec-card.open>.sec-head .chev{transform:rotate(90deg)}
.sec-body{display:none;padding:12px;border-top:1px solid var(--line)}
.sec-card.open .sec-body{display:block}
.zh-line{font-size:15px;line-height:1.85}
.py-line{font-size:12.5px;line-height:1.7;color:var(--gold);opacity:.9;margin-top:2px}
.en-line{font-size:12.8px;line-height:1.55;color:var(--muted);margin-top:2px}
.rdr.no-zh .zh-line,.rdr.no-py .py-line,.rdr.no-en .en-line{display:none}
.guide-note{color:var(--muted);font-size:12.5px}
.sec-count{font-size:11px;color:var(--muted);margin-bottom:8px}
.sec-body .btn-sm{margin-top:8px;font-size:12px;padding:4px 10px}
#loader{
  position:absolute;inset:0;z-index:1200;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;background:var(--bg);transition:opacity .35s;text-align:center;padding:20px;
}
#loader.hide{opacity:0;pointer-events:none}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loadMsg{font-size:13.5px;color:var(--muted)}
#retryBtn{display:none}
.prov-label{background:none;border:none;box-shadow:none;text-align:center;padding:0}
.prov-label .zh{font-size:12.5px;font-weight:700;line-height:1.25;color:var(--ink);text-shadow:0 0 3px var(--panel),0 0 6px var(--panel),0 0 2px var(--panel)}
.prov-label .py{font-size:9.5px;line-height:1.3;color:var(--muted);text-shadow:0 0 3px var(--panel),0 0 6px var(--panel);letter-spacing:.3px}
.prov-label.sm{display:none}
.z-hi .prov-label.sm{display:block}
.cap-label{background:none;border:none;box-shadow:none;font-size:11px;font-weight:700;color:var(--gold);padding:0;text-shadow:0 0 3px var(--panel),0 0 6px var(--panel);white-space:nowrap}
.cap-label i{font-style:normal;font-weight:400}
.cap-label::before{content:"●";font-size:7px;vertical-align:2px;margin-right:3px}
.leaflet-container{font:inherit}
.leaflet-control-attribution{background:rgba(255,255,255,.75)!important;font-size:10px!important}
@media(prefers-color-scheme:dark){.leaflet-control-attribution{background:rgba(20,22,24,.75)!important}.leaflet-control-attribution a{color:#7aa7c7}}
@media(max-width:720px){
  #searchBox{left:12px;width:calc(100% - 160px)}
  #panel{left:10px;right:10px;top:auto;bottom:10px;width:auto;max-height:55%;padding:18px}
  #basemapToggle{top:auto;bottom:80px}
  header{padding:10px 14px}
  #legend{display:none}
}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="logo hanzi">中</span><div>中国地图<div class="subtitle">Zhōngguó dìtú · provinces &amp; capitals · 省会 Shěnghuì</div></div></div>
  <div class="stats-row" id="statsRow"></div>
</header>

<div id="app">
  <div id="map"></div>

  <div class="map-ui" id="searchBox">
    <input id="searchInput" placeholder="Search 广东 / Guangdong / guangdong…" autocomplete="off">
    <div id="searchResults"></div>
  </div>

  <div class="map-ui" id="basemapToggle">
    <button data-bm="clean" class="active">Clean</button>
    <button data-bm="streets">Streets</button>
  </div>

  <div class="map-ui" id="legend"></div>

  <aside id="panel">
    <button id="panelClose">✕</button>
    <div id="pBig" class="hanzi"></div>
    <div id="pPy"></div>
    <div id="pEn"></div>
    <div id="pType"></div>
    <div class="cap-block">
      <div class="k">Capital · 省会 shěnghuì</div>
      <div id="capWrap"></div>
    </div>
    <div id="panelActions">
      <button class="btn primary" id="speakProv">🔊 Province</button>
      <button class="btn" id="speakCap">🔊 Capital</button>
    </div>
    <button class="btn" id="readBtn">📖 About this region · 本地介绍</button>
    <div id="reader" class="rdr"></div>
  </aside>

  <div id="loader">
    <div class="spinner"></div>
    <div id="loadMsg">Loading map boundaries…</div>
    <button class="btn" id="retryBtn">Retry</button>
  </div>
</div>
<script src="region-content.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.js"></script>
<script>
"use strict";
const GEO_URL="https://geo.datav.aliyun.com/areas_v3/bound/100000_full.json";
const TILE_URL="https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png";
const $=s=>document.querySelector(s);

const TYPES={
  province:{zh:"省",py:"shěng",en:"Province"},
  auto:{zh:"自治区",py:"zìzhìqū",en:"Autonomous region"},
  mun:{zh:"直辖市",py:"zhíxiáshì",en:"Municipality"},
  sar:{zh:"特别行政区",py:"tèbié xíngzhèngqū",en:"Special admin. region"}
};

const DATA={
  110000:{py:"Běijīng",en:"Beijing",type:"mun",full:"北京市",cap:["北京","Běijīng","Beijing",[39.9042,116.4074]]},
  120000:{py:"Tiānjīn",en:"Tianjin",type:"mun",full:"天津市",cap:["天津","Tiānjīn","Tianjin",[39.3434,117.3616]]},
  130000:{py:"Héběi",en:"Hebei",type:"province",full:"河北省",cap:["石家庄","Shíjiāzhuāng","Shijiazhuang",[38.0428,114.5149]]},
  140000:{py:"Shānxī",en:"Shanxi",type:"province",full:"山西省",cap:["太原","Tàiyuán","Taiyuan",[37.8706,112.5489]]},
  150000:{py:"Nèiménggǔ",en:"Inner Mongolia",type:"auto",full:"内蒙古自治区",cap:["呼和浩特","Hūhéhàotè","Hohhot",[40.8424,111.7500]]},
  210000:{py:"Liáoníng",en:"Liaoning",type:"province",full:"辽宁省",cap:["沈阳","Shěnyáng","Shenyang",[41.8057,123.4315]]},
  220000:{py:"Jílín",en:"Jilin",type:"province",full:"吉林省",cap:["长春","Chángchūn","Changchun",[43.8171,125.3235]]},
  230000:{py:"Hēilóngjiāng",en:"Heilongjiang",type:"province",full:"黑龙江省",cap:["哈尔滨","Hā'ěrbīn","Harbin",[45.8038,126.5350]]},
  310000:{py:"Shànghǎi",en:"Shanghai",type:"mun",full:"上海市",cap:["上海","Shànghǎi","Shanghai",[31.2304,121.4737]]},
  320000:{py:"Jiāngsū",en:"Jiangsu",type:"province",full:"江苏省",cap:["南京","Nánjīng","Nanjing",[32.0603,118.7969]]},
  330000:{py:"Zhèjiāng",en:"Zhejiang",type:"province",full:"浙江省",cap:["杭州","Hángzhōu","Hangzhou",[30.2741,120.1551]]},
  340000:{py:"Ānhuī",en:"Anhui",type:"province",full:"安徽省",cap:["合肥","Héféi","Hefei",[31.8206,117.2272]]},
  350000:{py:"Fújiàn",en:"Fujian",type:"province",full:"福建省",cap:["福州","Fúzhōu","Fuzhou",[26.0745,119.2965]]},
  360000:{py:"Jiāngxī",en:"Jiangxi",type:"province",full:"江西省",cap:["南昌","Nánchāng","Nanchang",[28.6820,115.8579]]},
  370000:{py:"Shāndōng",en:"Shandong",type:"province",full:"山东省",cap:["济南","Jǐnán","Jinan",[36.6512,117.1201]]},
  410000:{py:"Hénán",en:"Henan",type:"province",full:"河南省",cap:["郑州","Zhèngzhōu","Zhengzhou",[34.7466,113.6254]]},
  420000:{py:"Húběi",en:"Hubei",type:"province",full:"湖北省",cap:["武汉","Wǔhàn","Wuhan",[30.5928,114.3055]]},
  430000:{py:"Húnán",en:"Hunan",type:"province",full:"湖南省",cap:["长沙","Chángshā","Changsha",[28.2282,112.9388]]},
  440000:{py:"Guǎngdōng",en:"Guangdong",type:"province",full:"广东省",cap:["广州","Guǎngzhōu","Guangzhou",[23.1291,113.2644]]},
  450000:{py:"Guǎngxī",en:"Guangxi",type:"auto",full:"广西壮族自治区",cap:["南宁","Nánníng","Nanning",[22.8170,108.3665]]},
  460000:{py:"Hǎinán",en:"Hainan",type:"province",full:"海南省",cap:["海口","Hǎikǒu","Haikou",[20.0444,110.1999]]},
  500000:{py:"Chóngqìng",en:"Chongqing",type:"mun",full:"重庆市",cap:["重庆","Chóngqìng","Chongqing",[29.5630,106.5516]]},
  510000:{py:"Sìchuān",en:"Sichuan",type:"province",full:"四川省",cap:["成都","Chéngdū","Chengdu",[30.5728,104.0668]]},
  520000:{py:"Guìzhōu",en:"Guizhou",type:"province",full:"贵州省",cap:["贵阳","Guìyáng","Guiyang",[26.6470,106.6302]]},
  530000:{py:"Yúnnán",en:"Yunnan",type:"province",full:"云南省",cap:["昆明","Kūnmíng","Kunming",[24.8801,102.8329]]},
  540000:{py:"Xīzàng",en:"Tibet",type:"auto",full:"西藏自治区",cap:["拉萨","Lāsà","Lhasa",[29.6520,91.1721]]},
  610000:{py:"Shǎnxī",en:"Shaanxi",type:"province",full:"陕西省",cap:["西安","Xī'ān","Xi'an",[34.3416,108.9398]]},
  620000:{py:"Gānsù",en:"Gansu",type:"province",full:"甘肃省",cap:["兰州","Lánzhōu","Lanzhou",[36.0611,103.8343]]},
  630000:{py:"Qīnghǎi",en:"Qinghai",type:"province",full:"青海省",cap:["西宁","Xīníng","Xining",[36.6171,101.7782]]},
  640000:{py:"Níngxià",en:"Ningxia",type:"auto",full:"宁夏回族自治区",cap:["银川","Yínchuān","Yinchuan",[38.4872,106.2309]]},
  650000:{py:"Xīnjiāng",en:"Xinjiang",type:"auto",full:"新疆维吾尔自治区",cap:["乌鲁木齐","Wūlǔmùqí","Ürümqi",[43.8256,87.6168]]},
  710000:{py:"Táiwān",en:"Taiwan",type:"province",full:"台湾省",cap:["台北","Táiběi","Taipei",[25.0330,121.5654]]},
  810000:{py:"Xiānggǎng",en:"Hong Kong",type:"sar",full:"香港特别行政区",cap:null},
  820000:{py:"Àomén",en:"Macau",type:"sar",full:"澳门特别行政区",cap:null}
};
for(const k in DATA)DATA[k].adcode=+k;

const PALETTES={
  light:{
    bg:"#dde3e2",
    province:{fill:"#ecdcb4",stroke:"#a98c52"},
    auto:{fill:"#b9d6c5",stroke:"#567f66"},
    mun:{fill:"#eecfc3",stroke:"#ab6449"},
    sar:{fill:"#d8cde3",stroke:"#77639f"}
  },
  dark:{
    bg:"#101315",
    province:{fill:"#453d29",stroke:"#857247"},
    auto:{fill:"#274034",stroke:"#4f8066"},
    mun:{fill:"#47302a",stroke:"#95604a"},
    sar:{fill:"#332e44",stroke:"#6f5f97"}
  }
};
const paletteKey=()=>matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
let palette=PALETTES[paletteKey()];

function stripTones(s){
  return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/ü/g,"u").toLowerCase();
}
const SEARCH_INDEX=[];
for(const k in DATA){
  const d=DATA[k];
  SEARCH_INDEX.push({
    adcode:+k,
    han:d.full.replace(/(省|市|自治区|特别行政区|维吾尔|回族|壮族)/g,""),
    hanFull:d.full,
    py:d.py,
    pyPlain:stripTones(d.py),
    en:d.en.toLowerCase(),
    capHan:d.cap?d.cap[0]:"",
    capEn:d.cap?stripTones(d.cap[2]):"",
    capPyPlain:d.cap?stripTones(d.cap[1]):""
  });
}
function searchData(q){
  q=q.trim().toLowerCase();
  if(!q)return[];
  const out=[];
  for(const it of SEARCH_INDEX){
    if(it.han.startsWith(q)||it.hanFull.includes(q)||it.en.includes(q)||
       it.pyPlain.includes(q)||it.capHan.includes(q)||it.capEn.includes(q)||
       it.capPyPlain.includes(q))out.push(it);
  }
  return out.slice(0,8);
}

let map=null,geoLayer=null,tileLayer=null,capGroup=null;
const provLayers={};
let selected=null,darkMQ=null;

function styleFor(d,hov){
  const c=palette[d.type];
  return{
    fillColor:c.fill,fillOpacity:hov?.96:.82,
    color:c.stroke,
    weight:selected===d.adcode?3:(hov?2.2:1.2),
    opacity:1
  };
}
function restyleAll(){
  if(!geoLayer)return;
  geoLayer.eachLayer(l=>{
    const d=DATA[l.feature.properties.adcode];
    if(d&&selected!==d.adcode)l.setStyle(styleFor(d,false));
  });
}
function setBasemode(mode){
  document.querySelectorAll("#basemapToggle button").forEach(b=>b.classList.toggle("active",b.dataset.bm===mode));
  if(tileLayer){map.removeLayer(tileLayer);tileLayer=null;}
  document.getElementById("map").style.background=palette.bg;
  if(mode==="streets"){
    tileLayer=L.tileLayer(TILE_URL,{maxZoom:12,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/">CARTO</a>'}).addTo(map);
  }
}
function updateZoomClasses(){
  const z=map.getZoom();
  document.getElementById("map").classList.toggle("z-hi",z>=5);
  if(capGroup){if(z>=5)capGroup.addTo(map);else map.removeLayer(capGroup);}
}
function initMap(){
  map=L.map("map",{zoomControl:true,minZoom:3,maxZoom:12,zoomSnap:.5,attributionControl:false});
  L.control.attribution({prefix:false}).addAttribution('Boundaries © <a href="https://datav.aliyun.com" target="_blank" rel="noopener">Aliyun DataV</a>').addTo(map);
  map.fitBounds([[16,72],[54,136]],{padding:[16,16]});
  capGroup=L.layerGroup();
  setBasemode("clean");
  map.on("zoomend",updateZoomClasses);
  darkMQ=matchMedia("(prefers-color-scheme: dark)");
  darkMQ.addEventListener("change",e=>{
    palette=PALETTES[paletteKey()];
    restyleAll();rebuildLegend();initStats();
    if(!tileLayer)document.getElementById("map").style.background=palette.bg;
  });
}

function addLabels(f){
  const p=f.properties,d=DATA[p.adcode];
  const ll=p.centroid||p.center;
  if(!ll)return;
  const small=d.type==="mun"||d.type==="sar";
  L.tooltip({permanent:true,direction:"center",className:"prov-label"+(small?" sm":""),interactive:false})
    .setLatLng([ll[1],ll[0]])
    .setContent(`<div class="zh hanzi">${p.name.replace(/(省|市|自治区|特别行政区)$/,"")}</div><div class="py">${d.py}</div>`)
    .addTo(map);
  if(d.cap&&d.type!=="mun"){
    const[cLat,cLng]=d.cap[3];
    L.circleMarker([cLat,cLng],{radius:4,color:"#ffffff",weight:1.5,fillColor:"#b3382c",fillOpacity:1}).addTo(capGroup);
    L.tooltip({permanent:true,direction:"top",offset:[0,-7],className:"cap-label",interactive:false})
      .setLatLng([cLat,cLng])
      .setContent(`${esc(d.cap[0])} <i>${esc(d.cap[1])}</i>`)
      .addTo(capGroup);
  }
}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function onEach(f,layer){
  const d=DATA[f.properties.adcode];
  provLayers[d.adcode]=layer;
  layer.on({
    mouseover:()=>{if(selected!==d.adcode)layer.setStyle(styleFor(d,true));},
    mouseout:()=>{if(selected!==d.adcode)layer.setStyle(styleFor(d,false));},
    click:()=>select(d.adcode,false)
  });
}

async function fetchGeo(onPct){
  const res=await fetch(GEO_URL);
  if(!res.ok)throw new Error("HTTP "+res.status);
  const total=+res.headers.get("content-length")||0;
  if(!res.body||!total){onPct(1);return await res.json();}
  const reader=res.body.getReader(),dec=new TextDecoder();
  let got=0,parts=[];
  for(;;){
    const{done,value}=await reader.read();
    if(done)break;
    got+=value.length;parts.push(dec.decode(value,{stream:true}));
    onPct(got/total);
  }
  parts.push(dec.decode());
  return JSON.parse(parts.join(""));
}

async function loadGeo(){
  const loader=$("#loader"),msg=$("#loadMsg"),retry=$("#retryBtn");
  retry.style.display="none";loader.classList.remove("hide");
  try{
    const geo=await fetchGeo(p=>msg.textContent=`Loading map boundaries… ${Math.round(p*100)}%`);
    msg.textContent="Drawing…";
    await new Promise(r=>setTimeout(r,20));
    geo.features=geo.features.filter(f=>f.properties&&f.properties.name&&DATA[f.properties.adcode]);
    geoLayer=L.geoJSON(geo,{
      style:f=>styleFor(DATA[f.properties.adcode],false),
      onEachFeature:onEach
    }).addTo(map);
    geoLayer.eachLayer(l=>addLabels(l.feature));
    capGroup.addTo(map);
    updateZoomClasses();
    loader.classList.add("hide");
  }catch(err){
    console.warn(err);
    msg.innerHTML=`Couldn't download the boundary file.<br>Check your internet connection and retry.`;
    retry.style.display="";
    retry.onclick=()=>loadGeo();
  }
}

function select(adcode,fly=true){
  if(selected!==null&&provLayers[selected]&&selected!==adcode)
    provLayers[selected].setStyle(styleFor(DATA[selected],false));
  selected=adcode;
  const d=DATA[adcode];
  $("#pBig").textContent=d.full;
  $("#pPy").textContent=d.py;
  $("#pEn").textContent=d.en;
  $("#pType").textContent=`${TYPES[d.type].zh} ${TYPES[d.type].py} · ${TYPES[d.type].en}`;
  if(d.cap){
    $("#capWrap").innerHTML=
      `<div id="capHan" class="hanzi">${esc(d.cap[0])}</div>`+
      `<div id="capPy">${esc(d.cap[1])}</div>`+
      `<div id="capEn">${esc(d.cap[2])}</div>`;
    $("#speakCap").style.display="";
  }else{
    $("#capWrap").innerHTML=`<div style="color:var(--muted);font-size:13px;padding-top:4px">No separate capital — the region itself is province-level.</div>`;
    $("#speakCap").style.display="none";
  }
  $("#panel").classList.add("show");
  updateReader();
  if(provLayers[adcode])provLayers[adcode].setStyle(styleFor(d,false));
  if(fly){
    const f=geoLayer.getLayers().find(l=>l.feature.properties.adcode===adcode);
    const ll=f&&(f.feature.properties.centroid||f.feature.properties.center);
    if(ll)map.flyTo([ll[1],ll[0]],Math.max(map.getZoom(),d.type==="mun"||d.type==="sar"?8:6),{duration:.8});
  }
}
function closePanel(){
  $("#panel").classList.remove("show");
  readerOpen=false;
  const rdr=$("#reader"),btn=$("#readBtn");
  rdr.classList.remove("open");btn.classList.remove("on");
  btn.textContent="📖 About this region · 本地介绍";
  if(selected!==null&&provLayers[selected])
    provLayers[selected].setStyle(styleFor(DATA[selected],false));
  selected=null;
}

function speak(text){
  try{
    const synth=window.speechSynthesis;if(!synth)return;
    synth.cancel();
    const vs=synth.getVoices().filter(v=>/^zh/i.test(v.lang));
    const v=vs.find(x=>/cn|hans/i.test(x.lang))||vs[0];
    const u=new SpeechSynthesisUtterance(text);
    if(v)u.voice=v;else u.lang="zh-CN";
    u.rate=.85;synth.speak(u);
  }catch(e){}
}

function renderSearchResults(q){
  const box=$("#searchResults"),items=q?searchData(q):[];
  if(!items.length){box.style.display="none";box.innerHTML="";return;}
  box.innerHTML=items.map(it=>{
    const d=DATA[it.adcode];
    return`<div class="sr-item" data-ad="${it.adcode}">
      <span class="zh hanzi">${esc(it.han)}</span><span class="py">${esc(d.py)}</span>
      <span class="en">${esc(d.en)}${d.cap?" → "+esc(d.cap[2]):""}</span></div>`;
  }).join("");
  box.style.display="block";
  box.querySelectorAll(".sr-item").forEach(el=>el.onclick=()=>{
    select(+el.dataset.ad);$("#searchInput").value="";renderSearchResults("");
  });
}

function rebuildLegend(){
  const order=["province","auto","mun","sar"];
  $("#legend").innerHTML=order.map(t=>
    `<div class="row"><span class="sw" style="background:${palette[t].fill}"></span>${TYPES[t].en} · ${TYPES[t].zh}</div>`
  ).join("")+
  `<div class="row" style="margin-top:6px;border-top:1px solid var(--line);padding-top:6px"><span class="sw" style="background:#b3382c;border-radius:99px"></span>Capital 省会 — labels appear when you zoom in</div>`;
}
function initStats(){
  let n=0,p=0,a=0,m=0,s=0;
  for(const k in DATA){
    n++;
    if(DATA[k].type==="province")p++;
    else if(DATA[k].type==="auto")a++;
    else if(DATA[k].type==="mun")m++;
    else s++;
  }
  $("#statsRow").innerHTML=
    `<span class="chip"><b>${n}</b>regions</span>`+
    `<span class="chip"><b>${p}</b><span class="swatch" style="background:${palette.province.fill}"></span>provinces 省</span>`+
    `<span class="chip"><b>${a}</b><span class="swatch" style="background:${palette.auto.fill}"></span>autonomous 自治区</span>`+
    `<span class="chip"><b>${m}</b><span class="swatch" style="background:${palette.mun.fill}"></span>municipalities 直辖市</span>`+
    `<span class="chip"><b>${s}</b><span class="swatch" style="background:${palette.sar.fill}"></span>SARs</span>`;
}

let readerOpen=false;
function renderReader(){
  const rdr=$("#reader");
  if(selected===null||!REGION_CONTENT||!REGION_CONTENT[selected]){rdr.innerHTML="";return;}
  const content=REGION_CONTENT[selected];
  const keys=["history","culture","literature","culinary","nature","business","language"];
  let html='<div class="layer-row">';
  html+='<button class="lchip on" data-lang="all">All</button>';
  html+='<button class="lchip" data-lang="zh">中文</button>';
  html+='<button class="lchip" data-lang="py">Pinyin</button>';
  html+='<button class="lchip" data-lang="en">English</button>';
  html+='</div><div class="sec-count">7 sections · click to expand</div>';
  for(const key of keys){
    const sec=SECTION_DEFS[key],d=content[key];
    if(!sec||!d)continue;
    html+=`<div class="sec-card" data-sec="${key}">`;
    html+=`<div class="sec-head" onclick="toggleSection('${key}')">`;
    html+=`<span class="icon">${sec.icon}</span>`;
    html+=`<span class="t-zh hanzi">${sec.zh}</span>`;
    html+=`<span class="t-py">${sec.py}</span>`;
    html+=`<span class="t-en">${sec.en}</span>`;
    html+=`<span class="chev">▸</span>`;
    html+=`</div>`;
    html+=`<div class="sec-body">`;
    html+=`<div class="zh-line hanzi">${esc(d.zh)}</div>`;
    html+=`<div class="py-line">${esc(d.py)}</div>`;
    html+=`<div class="en-line">${esc(d.en)}</div>`;
    html+=`</div></div>`;
  }
  rdr.innerHTML=html;
  rdr.querySelectorAll(".lchip").forEach(ch=>{
    ch.onclick=()=>{
      rdr.querySelectorAll(".lchip").forEach(x=>x.classList.remove("on"));
      ch.classList.add("on");
      const lang=ch.dataset.lang;
      rdr.classList.remove("no-zh","no-py","no-en");
      if(lang==="zh"){rdr.classList.add("no-py","no-en");}
      else if(lang==="py"){rdr.classList.add("no-zh","no-en");}
      else if(lang==="en"){rdr.classList.add("no-zh","no-py");}
    };
  });
}
function toggleSection(key){
  const card=document.querySelector(`.sec-card[data-sec="${key}"]`);
  if(card)card.classList.toggle("open");
}
function toggleReader(){
  readerOpen=!readerOpen;
  const rdr=$("#reader"),btn=$("#readBtn");
  if(readerOpen){rdr.classList.add("open");btn.classList.add("on");btn.textContent="✕ Close reader · 关闭阅读";}
  else{rdr.classList.remove("open");btn.classList.remove("on");btn.textContent="📖 About this region · 本地介绍";}
}
function updateReader(){if(readerOpen)renderReader();}

function init(){
  if(typeof L==="undefined"){
    $("#loader").classList.add("hide");
    $("#loadMsg").innerHTML="Leaflet failed to load — check your internet connection and refresh.";
    return;
  }
  initMap();initStats();rebuildLegend();
  darkMQ.addEventListener("change",()=>{rebuildLegend();initStats();});
  document.querySelectorAll("#basemapToggle button").forEach(b=>b.onclick=()=>setBasemode(b.dataset.bm));
  $("#panelClose").onclick=closePanel;
  $("#speakProv").onclick=()=>{if(selected!==null)speak(DATA[selected].full.replace(/[省市]/g,""));};
  $("#speakCap").onclick=()=>{if(selected!==null&&DATA[selected].cap)speak(DATA[selected].cap[0]);};
  $("#readBtn").onclick=toggleReader;
  const si=$("#searchInput");
  si.addEventListener("input",()=>renderSearchResults(si.value));
  si.addEventListener("keydown",e=>{
    if(e.key==="Enter"){const f=document.querySelector("#searchResults .sr-item");if(f)f.click();}
    else if(e.key==="Escape"){si.value="";renderSearchResults("");}
  });
  document.addEventListener("click",e=>{if(!e.target.closest("#searchBox"))renderSearchResults("");});
  loadGeo();
}
if(typeof document!=="undefined"&&typeof module==="undefined"){
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init);
  else init();
}
if(typeof module!=="undefined"&&module.exports){
  module.exports={stripTones,searchData,get DATA(){return DATA;}};
}
</script>
